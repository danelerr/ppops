services:
  ppops:
    build:
      context: .
    image: ppops:0.1.0-beta.0
    init: true
    restart: unless-stopped
    user: "${PPOPS_UID:-1000}:${PPOPS_GID:-1000}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./instance/ppops.config.json:/app/config/ppops.config.json:ro
      - ./instance/data:/app/config/data
      - ./instance/secrets:/app/config/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
