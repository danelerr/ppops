services:
  ppops:
    build:
      context: .
    image: ${PPOPS_IMAGE:-ppops:0.1.0-beta.2}
    init: true
    restart: unless-stopped
    user: "${PPOPS_UID:-1000}:${PPOPS_GID:-1000}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./instance/ppops.config.json:/app/config/ppops.config.json:ro
      - ./instance/data:/app/config/data
      - ./instance/secrets:/app/config/secrets:ro
    read_only: true
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The RAILGUN scan is not cancellable. Give the daemon time to drain it
    # before the orchestrator escalates from SIGTERM to SIGKILL.
    stop_grace_period: 30m

  ppops-init:
    profiles: [setup]
    build:
      context: .
    image: ${PPOPS_IMAGE:-ppops:0.1.0-beta.2}
    user: "${PPOPS_UID:-1000}:${PPOPS_GID:-1000}"
    volumes:
      - ./instance:/app/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["init", "--help"]
