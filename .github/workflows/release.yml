name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/ppops-payer/package-lock.json
      - name: Verify release tag matches package version
        env:
          PPOPS_VERSION: ${{ github.ref_name }}
        run: |
          PPOPS_EXPECTED_TAG="v$(node -p 'require("./package.json").version')"
          if [ "$PPOPS_VERSION" != "$PPOPS_EXPECTED_TAG" ]; then
            printf 'Release tag %s does not match package version %s\n' "$PPOPS_VERSION" "$PPOPS_EXPECTED_TAG" >&2
            exit 1
          fi
      - name: Verify release source and generate SBOM
        run: |
          npm ci
          npm run payer:install
          npm run verify:all
          node -e "const primitive=require('./artifacts/primitive-gate-report.json'); const privacy=require('./artifacts/privacy-report.json'); if (primitive.decision !== 'GO' || primitive.productionReady !== false || privacy.result !== 'PASS') process.exit(1)"
          PPOPS_REPORT_SIGNER="$(node -p 'require("./artifacts/mainnet-gate-report.json").merchantSigner')"
          node dist/cli.js mainnet-gate-report-verify \
            --file ./artifacts/mainnet-gate-report.json \
            --expected-signer "$PPOPS_REPORT_SIGNER"
          npm run --silent sbom > "$RUNNER_TEMP/ppops-sbom.cdx.json"
          (cd tools/ppops-payer && ../../node_modules/.bin/cyclonedx-npm --ignore-npm-errors --package-lock-only --omit dev --output-reproducible --output-format JSON --output-file "$RUNNER_TEMP/ppops-payer-sbom.cdx.json")
          node -e "const fs=require('node:fs'); for (const [file,name] of [[process.argv[1],'ppops'],[process.argv[2],'ppops-payer']]) { const bom=JSON.parse(fs.readFileSync(file,'utf8')); if (bom.bomFormat !== 'CycloneDX' || bom.metadata?.component?.name !== name || !Array.isArray(bom.components) || bom.components.length === 0) process.exit(1) }" "$RUNNER_TEMP/ppops-sbom.cdx.json" "$RUNNER_TEMP/ppops-payer-sbom.cdx.json"
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable container
        env:
          PPOPS_IMAGE: ghcr.io/${{ github.repository }}
          PPOPS_VERSION: ${{ github.ref_name }}
          PPOPS_REVISION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg "VERSION=$PPOPS_VERSION" \
            --build-arg "VCS_REF=$PPOPS_REVISION" \
            --tag "$PPOPS_IMAGE:$PPOPS_VERSION" \
            --tag "$PPOPS_IMAGE:sha-$PPOPS_REVISION" \
            .
          docker push "$PPOPS_IMAGE:$PPOPS_VERSION"
          docker push "$PPOPS_IMAGE:sha-$PPOPS_REVISION"
          PPOPS_REPO_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$PPOPS_IMAGE:$PPOPS_VERSION")"
          case "$PPOPS_REPO_DIGEST" in
            "$PPOPS_IMAGE@sha256:"*) ;;
            *)
              printf 'Unexpected container digest: %s\n' "$PPOPS_REPO_DIGEST" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$PPOPS_REPO_DIGEST" > "$RUNNER_TEMP/ppops-container-digest.txt"
      - name: Publish GitHub release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PPOPS_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$PPOPS_VERSION" --verify-tag --generate-notes \
            "$RUNNER_TEMP/ppops-sbom.cdx.json#Merchant CycloneDX SBOM" \
            "$RUNNER_TEMP/ppops-payer-sbom.cdx.json#Payer CycloneDX SBOM" \
            "$RUNNER_TEMP/ppops-container-digest.txt#Immutable container digest" \
            "artifacts/primitive-gate-report.json#Primitive Gate report" \
            "artifacts/privacy-report.json#Privacy report" \
            "artifacts/mainnet-gate-report.json#Mainnet Gate report"
