name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/ppops-payer/package-lock.json
      - run: npm ci
      - run: npm run payer:install
      - run: npm run verify:all
      - name: Generate CycloneDX SBOM
        run: npm run --silent sbom > "$RUNNER_TEMP/ppops-sbom.cdx.json"
      - name: Generate payer CycloneDX SBOM
        working-directory: tools/ppops-payer
        run: ../../node_modules/.bin/cyclonedx-npm --ignore-npm-errors --package-lock-only --omit dev --output-reproducible --output-format JSON --output-file "$RUNNER_TEMP/ppops-payer-sbom.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ppops-sboms
          path: |
            ${{ runner.temp }}/ppops-sbom.cdx.json
            ${{ runner.temp }}/ppops-payer-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag ppops:ci .
