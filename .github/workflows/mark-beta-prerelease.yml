name: mark beta prerelease

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mark-beta-prerelease.yml

permissions:
  contents: write

jobs:
  mark-prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Mark v0.1.0-beta.0 as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0-beta.0" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F prerelease=true \
            --silent
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.prerelease')" = "true"
